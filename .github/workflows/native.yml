name: Native Build

on:
  push:
    branches: [ dev, test, main ]
  pull_request:
    branches: [ dev, test, main ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, linux, macos, windows)'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - linux
        - macos
        - windows

env:
  # 与本地一致：GraalVM Community 25.0.2（JDK 25）。勿改回 21：统一格式 reachability-metadata.json
  # 在 GraalVM for JDK 21(23.1.2) 的 native-image 上不会被读取，只有旧的 *-config.json 生效。
  GRAALVM_VERSION: '25.0.2'
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g'

jobs:
  native-linux:
    name: Native Linux
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' || github.event.inputs.platform == ''
    
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx6g'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21 (Gradle toolchain / build JVM)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        version: ${{ env.GRAALVM_VERSION }}
        distribution: 'graalvm-community'
        # native-image 自 JDK 21 起随发行版内置（gu 已移除），不要再用 components 参数
        set-java-home: 'false'   # 保留 JAVA_HOME=JDK21 给 Gradle toolchain，native-image 由 GRAALVM_HOME 提供
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify GraalVM installation
      run: native-image --version
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-native-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev
        
    - name: Build native executable
      run: ./gradlew :app:nativeCompile -x test
      timeout-minutes: 60
      
    - name: Verify native executable (Linux)
      run: |
        ls -la app/build/native/nativeCompile/
        file app/build/native/nativeCompile/XAgent*
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-linux
        path: app/build/native/nativeCompile/XAgent*
        if-no-files-found: error

  native-macos:
    name: Native macOS
    runs-on: macos-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' || github.event.inputs.platform == ''
    
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx8g'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21 (Gradle toolchain / build JVM)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        version: ${{ env.GRAALVM_VERSION }}
        distribution: 'graalvm-community'
        # native-image 自 JDK 21 起随发行版内置（gu 已移除），不要再用 components 参数
        set-java-home: 'false'   # 保留 JAVA_HOME=JDK21 给 Gradle toolchain，native-image 由 GRAALVM_HOME 提供
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify GraalVM installation
      run: native-image --version
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-native-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build native executable
      run: ./gradlew :app:nativeCompile -x test
      timeout-minutes: 60
      
    - name: Verify native executable (macOS)
      run: |
        ls -la app/build/native/nativeCompile/
        file app/build/native/nativeCompile/XAgent*
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-macos
        path: app/build/native/nativeCompile/XAgent*
        if-no-files-found: error

  native-windows:
    name: Native Windows
    runs-on: windows-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' || github.event.inputs.platform == ''
    
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4g'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21 (Gradle toolchain / build JVM)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        version: ${{ env.GRAALVM_VERSION }}
        distribution: 'graalvm-community'
        # native-image 自 JDK 21 起随发行版内置（gu 已移除），不要再用 components 参数
        set-java-home: 'false'   # 保留 JAVA_HOME=JDK21 给 Gradle toolchain，native-image 由 GRAALVM_HOME 提供
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify GraalVM installation
      run: native-image --version
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-native-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Add Windows SDK
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build native executable
      run: ./gradlew.bat :app:nativeCompile -x test
      timeout-minutes: 60
      
    - name: Verify native executable (Windows)
      run: |
        dir app\build\native\nativeCompile\
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-windows
        path: app/build/native/nativeCompile/XAgent*
        if-no-files-found: error
