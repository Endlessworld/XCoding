[versions]
vanniktechMavenPublish = "0.34.0"
springAi = "2.0.0-M1"
springAiAlibaba = "2.0.0-M1.1"
reactor = "3.6.0"
jackson = "2.17.0"
lombok = "1.18.38"
agentclientprotocol = "0.23.0"
ktor = "3.1.3"
jsoup = "1.18.3"
kotlinxCoroutines = "1.9.0"
kotlinxCollectionsImmutable = "0.3.7"
groovy = "3.0.25"

[libraries]
spring-ai-openai = { group = "org.springframework.ai", name = "spring-ai-openai", version.ref = "springAi" }
spring-ai-mcp-client = { group = "org.springframework.ai", name = "spring-ai-starter-mcp-client-webflux", version.ref = "springAi" }
reactor-core = { group = "io.projectreactor", name = "reactor-core", version.ref = "reactor" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
spring-ai-alibaba-graph = { group = "com.alibaba.cloud.ai", name = "spring-ai-alibaba-graph-core", version.ref = "springAiAlibaba" }
spring-ai-alibaba-agent = { group = "com.alibaba.cloud.ai", name = "spring-ai-alibaba-agent-framework", version.ref = "springAiAlibaba" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
# ACP SDK
acp-jvm = { group = "com.agentclientprotocol", name = "acp-jvm", version.ref = "agentclientprotocol" }
acp-model-jvm = { group = "com.agentclientprotocol", name = "acp-model-jvm", version.ref = "agentclientprotocol" }
acp-ktor-jvm = { group = "com.agentclientprotocol", name = "acp-ktor-jvm", version.ref = "agentclientprotocol" }
acp-ktor-client-jvm = { group = "com.agentclientprotocol", name = "acp-ktor-client-jvm", version.ref = "agentclientprotocol" }
acp-ktor-server-jvm = { group = "com.agentclientprotocol", name = "acp-ktor-server-jvm", version.ref = "agentclientprotocol" }
acp-ktor-server = { group = "com.agentclientprotocol", name = "acp-ktor-server", version.ref = "agentclientprotocol" }

# Ktor HTTP Client (engine required by ACP Ktor transport)
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }

# HTML parsing
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Kotlin & KotlinX
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-jdk8 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-jdk8", version.ref = "kotlinxCoroutines" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# Groovy (GroovyScriptTool for MCP tool orchestration)
groovy = { group = "org.codehaus.groovy", name = "groovy", version.ref = "groovy" }
groovy-json = { group = "org.codehaus.groovy", name = "groovy-json", version.ref = "groovy" }
[plugins]
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }