[package]
name = "tui-rust"
version = "0.1.0"
edition = "2021"
description = "XAgent TUI (Rust) - ACP WebSocket 客户端终端界面"

[dependencies]
# ACP SDK（本地引用 rust-sdk workspace）
agent-client-protocol = { path = "D:/IdeaProjects/rust-sdk/src/agent-client-protocol", features = ["unstable_protocol_v2"] }
agent-client-protocol-http = { path = "D:/IdeaProjects/rust-sdk/src/agent-client-protocol-http", features = ["client"] }

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "process"] }
futures = "0.3"

# 终端 UI
ratatui = "0.28"
crossterm = "0.28"

# 序列化与错误处理
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# 时间
chrono = "0.4"
